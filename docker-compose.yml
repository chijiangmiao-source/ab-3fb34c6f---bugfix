name: optics-release

services:
  devices:
    build:
      context: .
      target: devices
    environment:
      PORT: "9000"
      DATA_DIR: /data
      TEST_HOOKS: ${TEST_HOOKS:-1}
    volumes:
      - devices-data:/data
    # 模拟器仅面向内部网络，不暴露宿主端口

  app:
    build:
      context: .
      target: app
    environment:
      PORT: "8080"
      DATA_DIR: /data
      WEB_DIST: /app/web/dist
      SIMULATOR_URL: http://devices:9000
      KNOWN_DEVICES: ${KNOWN_DEVICES:-collector-1,collector-2,collector-3}
      TEST_HOOKS: ${TEST_HOOKS:-1}
    volumes:
      - app-data:/data
    ports:
      # 宿主端口可配置：APP_PORT=9090 docker compose up app
      - "${APP_PORT:-8080}:8080"
    depends_on:
      devices:
        condition: service_healthy

  verify:
    build:
      context: .
      target: verify
    environment:
      API_BASE: http://app:8080
      SIMULATOR_URL: http://devices:9000
    depends_on:
      app:
        condition: service_healthy
      devices:
        condition: service_healthy

volumes:
  app-data:
  devices-data:
